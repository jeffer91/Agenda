<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1769aa" />
  <title>Agenda</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Agenda</div>
    <div class="top-actions" aria-label="Conexiones">
      <button id="googleBtn" type="button" class="btn secondary">Conectar Google</button>
      <button id="syncBtn" type="button" class="btn">Sincronizar</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <nav id="nav" aria-label="Secciones de Agenda">
        <button type="button" class="nav-item active" data-view="today">Hoy</button>
        <button type="button" class="nav-item" data-view="calendar">Calendario</button>
        <button type="button" class="nav-item" data-view="tasks">Pendientes</button>
        <button type="button" class="nav-item" data-view="projects">Proyectos</button>
        <button type="button" class="nav-item" data-view="goals">Objetivos de vida</button>
        <button type="button" class="nav-item" data-view="journal">Mi diario</button>
        <button type="button" class="nav-item" data-view="ideas">Ideas</button>
        <button type="button" class="nav-item" data-view="stats">Estadísticas</button>
      </nav>
    </aside>

    <main id="app" class="content"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <dialog id="setupDialog" class="modal" aria-labelledby="setupTitle">
    <form method="dialog" id="setupForm">
      <h2 id="setupTitle">Conectar Google</h2>
      <p class="muted">
        Pega <strong>solo el ID de cliente OAuth 2.0</strong> de tu credencial de tipo
        <strong>Aplicación web</strong>. No necesitas ni debes pegar el secreto del cliente.
      </p>
      <p id="oauthHint" class="muted"></p>
      <label>Google OAuth Client ID
        <input
          id="clientIdInput"
          required
          autocomplete="off"
          spellcheck="false"
          placeholder="123456789-abc123.apps.googleusercontent.com"
        />
      </label>
      <p class="muted" style="font-size:.9rem">
        El ID termina en <strong>.apps.googleusercontent.com</strong> y se guarda únicamente en este dispositivo.
      </p>
      <p class="muted" style="font-size:.9rem">
        <a href="https://console.cloud.google.com/auth/clients" target="_blank" rel="noopener noreferrer">Abrir clientes OAuth en Google Cloud</a>
      </p>
      <div class="dialog-actions">
        <button id="setupCancel" type="button" class="btn secondary" onclick="document.getElementById('setupDialog').close('cancel')">Cancelar</button>
        <button id="saveClientId" type="submit" value="default" class="btn">Guardar y conectar</button>
      </div>
    </form>
  </dialog>

  <dialog id="entityDialog" class="modal" aria-labelledby="entityTitle">
    <form method="dialog" id="entityForm">
      <h2 id="entityTitle">Nuevo</h2>
      <div id="entityFields"></div>
      <div class="dialog-actions">
        <button id="entityCancel" type="button" class="btn secondary" onclick="document.getElementById('entityDialog').close('cancel')">Cancelar</button>
        <button id="entitySave" type="submit" value="default" class="btn">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./firebase.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
